version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kairo-postgres
    environment:
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo
      POSTGRES_DB: kairo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairo-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://kairo:kairo@postgres:5432/kairo
      - APP_ENV=development
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: